[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-api"
version = "0.1.0"
description = "Shared credential-safe Vikunja v2 API client for the Dev2026 projects"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["todo_api"]
